[package]
name = "game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = [
  "debug",
  "dynamic_linking",
  "bevy_picking",
] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[[bin]]
name = "GaranStrartegyChuss"
path = "game/src/main.rs"
